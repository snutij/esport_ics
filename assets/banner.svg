e="#f2a900" stroke-opacity=".55"/><circle cx="16" cy="16" r="4" fill="#f2a900"/><text x="28" y="20.5" class="pill">PUBG</text></g><g transform="translate(3467,0)"><rect x=".5" y=".5" width="137" height="31" rx="15.5" fill="#ffffff" fill-opacity=".05" stroke="#2ee59d" stroke-opacity=".55"/><circle cx="16" cy="16" r="4" fill="#2ee59d"/><text x="28" y="20.5" class="pill">EA Sports FC</text></g><g transform="translate(3617,0)"><rect x=".5" y=".5" width="158" height="31" rx="15.5" fill="#ffffff" fill-opacity=".05" stroke="#7b61ff" stroke-opacity=".55"/><circle cx="16" cy="16" r="4" fill="#7b61ff"/><text x="28" y="20.5" class="pill">Mobile Legends</text></g><g transform="translate(3788,0)"><rect x=".5" y=".5" width="124" height="31" rx="15.5" fill="#ffffff" fill-opacity=".05" stroke="#00b4ff" stroke-opacity=".55"/><circle cx="16" cy="16" r="4" fill="#00b4ff"/><text x="28" y="20.5" class="pill">StarCraft 2</text></g><g transform="translate(3925,0)"><rect x=".5" y=".5" width="129" height="31" rx="15.5" fill="#ffffff" fill-opacity=".05" stroke="#9be15d" stroke-opacity=".55"/><circle cx="16" cy="16" r="4" fill="#9be15d"/><text x="28" y="20.5" class="pill">Call of Duty</text></g><g transform="translate(4067,0)"><rect x=".5" y=".5" width="106" height="31" rx="15.5" fill="#ffffff" fill-opacity=".05" stroke="#36d1dc" stroke-opacity=".55"/><circle cx="16" cy="16" r="4" fill="#36d1dc"/><text x="28" y="20.5" class="pill">Wild Rift</text></g><g transform="translate(4186,0)"><rect x=".5" y=".5" width="139" height="31" rx="15.5" fill="#ffffff" fill-opacity=".05" stroke="#ffcc4d" stroke-opacity=".55"/><circle cx="16" cy="16" r="4" fill="#ffcc4d"/><text x="28" y="20.5" class="pill">King of Glory</text></g><g transform="translate(4338,0)"><rect x=".5" y=".5" width="197" height="31" rx="15.5" fill="#ffffff" fill-opacity=".05" stroke="#8fa8ff" stroke-opacity=".55"/><circle cx="16" cy="16" r="4" fill="#8fa8ff"/><text x="28" y="20.5" class="pill">StarCraft: Brood War</text></g></g></g></g>
