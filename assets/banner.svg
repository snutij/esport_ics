<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Esport ICS: free calendar subscriptions for esports teams, updated hourly">
<title>Esport ICS</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset="1" stop-color="#121833"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b61ff"/><stop offset=".5" stop-color="#00d4ff"/><stop offset="1" stop-color="#2ee59d"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="orb1"><stop offset="0" stop-color="#7b61ff" stop-opacity=".45"/><stop offset="1" stop-color="#7b61ff" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#00d4ff" stop-opacity=".35"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".07" stop-color="#fff"/><stop offset=".93" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="mqm" maskUnits="userSpaceOnUse" x="60" y="246" width="620" height="40"><rect x="60" y="246" width="620" height="40" fill="url(#fade)"/></mask>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.title{font-size:76px;font-weight:800;fill:#fff;letter-spacing:-2px}
.sub{font-size:21px;fill:#a9b1d6}
.badge{font-size:12px;font-weight:700;fill:#2ee59d;letter-spacing:1.6px}
.pill{font-size:13px;font-weight:600;fill:#e6e9f5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
.time{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:17px;font-weight:700;fill:#fff}
.match{font-size:15px;font-weight:700;fill:#fff}
.game{font-size:11.5px;font-weight:600;letter-spacing:.4px}
.status{font-size:11px;font-weight:700;fill:#0e1328;letter-spacing:.5px}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#6b7393}
.marquee{animation:mq 45s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-2274px)}}
.dot{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.8)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ===== synced 9s timeline =====
   0-17%   two .ics files (one per team) fly toward the card, B 0.3s after A
   17-24%  files merge into the card (shrink + fade), ripple + glow flash, sync icon spins, status "Syncing"
   25/30/35% events slide in one by one, status "Up to date"
   86-94%  events fade out, loop */
.ics{opacity:0;transform-box:fill-box;transform-origin:center;animation:fly 9s cubic-bezier(.5,0,.3,1) infinite}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(1)}4%{opacity:1;transform:translate(0,0) scale(1)}17%{opacity:1;transform:translate(118px,0) scale(1)}21%{opacity:0;transform:translate(138px,0) scale(.3)}100%{opacity:0;transform:translate(138px,0) scale(.3)}}
.ripple{opacity:0;transform-box:fill-box;transform-origin:center;animation:ripple 9s ease-out infinite}
.ics-b,.rp-b{animation-delay:.3s}
@keyframes ripple{0%,17%{opacity:0;transform:scale(.2)}18%{opacity:.9;transform:scale(.3)}28%{opacity:0;transform:scale(2.4)}100%{opacity:0;transform:scale(2.4)}}
.flash{opacity:.25;animation:flash 9s ease-out infinite}
@keyframes flash{0%,17%{opacity:.25}24%{opacity:.85}38%,100%{opacity:.25}}
.sync{transform-box:fill-box;transform-origin:center;animation:spin 9s cubic-bezier(.4,0,.2,1) infinite}
@keyframes spin{0%,16%{transform:rotate(0)}34%,100%{transform:rotate(720deg)}}
.st-sync{opacity:0;animation:stsync 9s linear infinite}
@keyframes stsync{0%,16%{opacity:0}17%,35%{opacity:1}36%,100%{opacity:0}}
.st-ok{animation:stok 9s linear infinite}
@keyframes stok{0%,16%{opacity:1}17%,35%{opacity:0}36%,100%{opacity:1}}
.evi{opacity:0}
.ev0{animation:ev0 9s cubic-bezier(.2,.8,.2,1) infinite}
.ev1{animation:ev1 9s cubic-bezier(.2,.8,.2,1) infinite}
.ev2{animation:ev2 9s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes ev0{0%,25%{opacity:0;transform:translateX(-24px)}30%,86%{opacity:1;transform:translateX(0)}93%,100%{opacity:0;transform:translateX(0)}}
@keyframes ev1{0%,30%{opacity:0;transform:translateX(-24px)}35%,86%{opacity:1;transform:translateX(0)}93%,100%{opacity:0;transform:translateX(0)}}
@keyframes ev2{0%,35%{opacity:0;transform:translateX(-24px)}40%,86%{opacity:1;transform:translateX(0)}93%,100%{opacity:0;transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.evi{opacity:1}.ics,.ripple,.st-sync{opacity:0}}
</style>
<rect width="1280" height="360" fill="url(#bg)"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<circle cx="180" cy="40" r="260" fill="url(#orb1)"><animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1050" cy="330" r="280" fill="url(#orb2)"><animate attributeName="cy" values="330;250;330" dur="12s" repeatCount="indefinite"/></circle>

<!-- left -->
<g transform="translate(60,56)">
<rect x=".5" y=".5" width="243" height="27" rx="13.5" fill="#2ee59d" fill-opacity=".1" stroke="#2ee59d" stroke-opacity=".4"/>
<circle class="dot" cx="18" cy="14" r="4" fill="#2ee59d"/>
<text x="32" y="18.5" class="badge">LIVE · UPDATED HOURLY</text>
</g>
<text x="56" y="166" class="title">Esport <tspan fill="url(#accent)">ICS</tspan></text>
<text x="60" y="208" class="sub">Free calendar subscriptions for esports teams.</text>
